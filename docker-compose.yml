# Run from the repo root:
#   cp .env.example .env     (then set JWT_SECRET)
#   docker compose up --build
# Frontend: http://localhost:3000   Backend: http://localhost:5000   MongoDB: internal
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/attendance
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (see .env.example)}
    ports:
      - "5000:5000"

  frontend:
    build:
      context: ./frontend/frontend
      args:
        # Called from the browser, so this is localhost, not the "backend" service name.
        # To use the deployed Render backend instead:
        #   REACT_APP_API_URL=https://geo-fencing-nrcj.onrender.com/api
        REACT_APP_API_URL: ${REACT_APP_API_URL:-http://localhost:5000/api}
    depends_on:
      - backend
    ports:
      - "3000:80"
    restart: unless-stopped

volumes:
  mongo-data:
